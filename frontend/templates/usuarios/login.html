<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión · Parqueadero</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell page-shell--narrow">
    <section class="auth-card">
        <div class="brand-mark" aria-hidden="true">P</div>
        <p class="eyebrow">Parqueadero</p>
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Ingresa con el correo y la contraseña de tu cuenta.</p>

        <p class="notice notice--error" role="alert" th:if="${param.error}">El correo o la contraseña no son válidos.</p>
        <p class="notice notice--success" role="status" th:if="${param.logout}">La sesión se cerró correctamente.</p>

        <form class="stack-form" th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Correo electrónico</label>
                <input id="username" name="username" type="email" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button" type="submit">Entrar</button>
        </form>

        <p class="auth-links"><a th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a></p>
    </section>
</main>
</body>
</html>

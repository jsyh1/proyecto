<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header><nav><a th:href="@{/}">Parqueadero</a><a th:href="@{/sesiones/entrada}">Sesiones</a><a th:href="@{/usuarios/validaciones}">Mis beneficios</a></nav></header>
<main>
    <h1>Mi perfil</h1><p id="estado" class="notice" role="status">Cargando perfil…</p>
    <p id="acceso"><a th:href="@{/usuarios/login}">Iniciar sesión</a> · <a th:href="@{/usuarios/registro}">Crear cuenta</a></p>
    <form id="perfil" hidden>
        <label>Nombre<input name="nombre" maxlength="50" required></label>
        <label>Apellido<input name="apellido" maxlength="50" required></label>
        <label>Documento<input name="documento" readonly></label>
        <label>Correo electrónico<input name="correo" type="email" maxlength="100" required></label>
        <label>Teléfono<input name="telefono" type="tel" maxlength="20"></label>
        <button type="submit">Guardar cambios</button>
    </form>
    <section id="datos-vehiculos" class="card" hidden>
        <h2>Registrar vehículo</h2>
        <form id="vehiculo">
            <label>Placa<input name="placa" maxlength="10" placeholder="ABC123" required></label>
            <label>Marca<input name="marca" maxlength="30"></label>
            <label>Modelo<input name="modelo" maxlength="30"></label>
            <label>Color<input name="color" maxlength="20"></label>
            <button type="submit">Agregar vehículo</button>
        </form>
        <p id="vehiculo-mensaje" class="notice" role="status"></p>
        <h3>Mis vehículos</h3>
        <ul id="lista-vehiculos" class="list"></ul>
    </section>
    <section id="sesiones-anteriores" class="card" hidden>
        <h2>Mis sesiones anteriores</h2>
        <ul id="lista-sesiones" class="list"></ul>
    </section>
    <div id="acciones-cuenta" class="actions" hidden><button id="salir" class="secondary" type="button">Cerrar sesión</button><a th:href="@{/usuarios/notificaciones}">Mis notificaciones</a></div>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
window.addEventListener("DOMContentLoaded", async () => {
    const form = document.getElementById("perfil");
    const state = document.getElementById("estado");
    try {
        const response = await App.api("/api/usuarios/me");
        const data = await App.responseData(response);
        if (!response.ok) throw new Error("Inicia sesión para consultar tu perfil.");
        window.idUsuarioActual = data.id;
        for (const [key, value] of Object.entries(data)) {
            const field = form.elements.namedItem(key);
            if (field) field.value = value || "";
        }
        form.hidden = false;
        document.getElementById("datos-vehiculos").hidden = false;
        document.getElementById("sesiones-anteriores").hidden = false;
        document.getElementById("acciones-cuenta").hidden = false;
        document.getElementById("acceso").hidden = true;
        App.show("estado", "");
        await cargarVehiculos();
        await cargarSesiones();
    } catch (error) { App.show("estado", error.message, true); }
});
async function cargarVehiculos() {
    const response = await App.api("/api/vehiculos/me");
    const data = await App.responseData(response);
    if (!response.ok) return;
    const list = document.getElementById("lista-vehiculos"); list.replaceChildren();
    for (const vehicle of data) {
        const item = document.createElement("li");
        item.textContent = `${vehicle.placa} — ${vehicle.marca || "Sin marca"} ${vehicle.modelo || ""} ${vehicle.color || ""}`;
        list.append(item);
    }
}
async function cargarSesiones() {
    const response = await App.api(`/usuarios/${window.idUsuarioActual}/sesiones`);
    const data = await App.responseData(response);
    if (!response.ok) return;
    const list = document.getElementById("lista-sesiones"); list.replaceChildren();
    for (const session of data) {
        const item = document.createElement("li");
        item.textContent = `${session.placa} — ${session.centro} — ${session.fechaEntrada} — ${session.estado} — $ ${session.montoPagado ?? "pendiente"}`;
        list.append(item);
    }
}
document.getElementById("perfil").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    const data = Object.fromEntries(["nombre", "apellido", "correo", "telefono"]
        .map(name => [name, form.elements.namedItem(name).value]));
    try {
        const response = await App.api("/api/usuarios/me", { method: "PUT", body: JSON.stringify(data) });
        const result = await App.responseData(response);
        if (!response.ok) throw new Error(result.detail || "No fue posible guardar los cambios.");
        App.show("estado", "Perfil actualizado correctamente.");
    } catch (error) { App.show("estado", error.message, true); }
});
document.getElementById("vehiculo").addEventListener("submit", async event => {
    event.preventDefault();
    try {
        if (!window.idUsuarioActual) throw new Error("Inicia sesión para agregar un vehículo.");
        const data = Object.fromEntries(new FormData(event.currentTarget).entries());
        data.idUsuario = window.idUsuarioActual;
        const response = await App.api("/api/vehiculos", { method: "POST", body: JSON.stringify(data) });
        const result = await App.responseData(response);
        if (!response.ok) throw new Error(result.detail || "No fue posible agregar el vehículo.");
        App.show("vehiculo-mensaje", `Vehículo ${result.placa} agregado correctamente.`);
        event.currentTarget.reset();
        await cargarVehiculos();
    } catch (error) { App.show("vehiculo-mensaje", error.message, true); }
});
document.getElementById("salir").addEventListener("click", async () => {
    try {
        const response = await App.api("/api/auth/logout", { method: "POST" });
        if (!response.ok) throw new Error("No fue posible cerrar sesión.");
        window.location.href = "/";
    } catch (error) { App.show("estado", error.message, true); }
});
</script>
</body>
</html>

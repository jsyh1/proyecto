<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        main { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
        .mensaje { background: #e8f4fd; padding: 10px; border-radius: 4px; }
        .error { background: #fdecea; color: #b71c1c; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<main>
    <h1>Recuperar contraseña</h1>
    <p>Ingresa el correo asociado a tu cuenta. Si existe, recibirás un enlace de recuperación.</p>
    <p class="mensaje" role="status" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form th:action="@{/recuperar-contrasena}" th:object="${solicitud}" method="post">
        <label for="correo">Correo electrónico</label>
        <input id="correo" type="email" th:field="*{correo}" maxlength="100" autocomplete="email" required>
        <button type="submit">Enviar instrucciones</button>
    </form>
</main>
</body>
</html>

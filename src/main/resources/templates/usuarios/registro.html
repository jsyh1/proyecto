<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header><nav><a th:href="@{/}">Parqueadero</a><a th:href="@{/usuarios/login}">Ingresar</a></nav></header>
<main>
    <h1>Crear cuenta</h1><p>Los campos marcados son obligatorios. La contraseña se almacena protegida.</p>
    <form id="registro">
        <label>Nombre<input name="nombre" maxlength="50" autocomplete="given-name" required></label>
        <label>Apellido<input name="apellido" maxlength="50" autocomplete="family-name" required></label>
        <label>Documento<input name="documento" maxlength="20" required></label>
        <label>Correo electrónico<input name="correo" type="email" maxlength="100" autocomplete="email" required></label>
        <label>Teléfono<input name="telefono" type="tel" maxlength="20" autocomplete="tel"></label>
        <label>Contraseña<input name="password" type="password" minlength="10" maxlength="72" autocomplete="new-password" aria-describedby="ayuda-password" required></label>
        <small id="ayuda-password">Mínimo 10 caracteres; máximo 72 bytes UTF-8.</small>
        <button type="submit">Crear cuenta</button>
    </form>
    <p id="mensaje" class="notice" role="status"></p>
    <p>¿Ya tienes una cuenta? <a th:href="@{/usuarios/login}">Inicia sesión</a>.</p>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
document.getElementById("registro").addEventListener("submit", async event => {
    event.preventDefault();
    await App.submitJson(event.currentTarget, "/api/usuarios/registro", "POST", "mensaje", () => {
        window.location.href = "/usuarios/login";
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Restablecer contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        main { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 16px; cursor: pointer; }
        .mensaje { background: #e8f4fd; padding: 10px; border-radius: 4px; }
        .error { background: #fdecea; color: #b71c1c; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<main>
    <h1>Restablecer contraseña</h1>
    <p class="mensaje" role="status" th:if="${exito}" th:text="${exito}"></p>
    <p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form th:unless="${exito}" th:action="@{/restablecer-contrasena}" th:object="${restablecer}" method="post">
        <input type="hidden" th:field="*{token}">
        <label for="nuevaContrasena">Nueva contraseña</label>
        <input id="nuevaContrasena" type="password" th:field="*{nuevaContrasena}"
               minlength="8" maxlength="72" autocomplete="new-password" required>
        <label for="confirmacion">Confirma la contraseña</label>
        <input id="confirmacion" type="password" th:field="*{confirmacion}"
               minlength="8" maxlength="72" autocomplete="new-password" required>
        <button type="submit">Cambiar contraseña</button>
    </form>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header><nav><a th:href="@{/}">Parqueadero</a><a th:href="@{/usuarios/registro}">Crear cuenta</a></nav></header>
<main>
    <h1>Iniciar sesión</h1><p>Usa el correo y la contraseña de tu cuenta.</p>
    <form id="login">
        <label>Correo electrónico<input name="correo" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Ingresar</button>
    </form>
    <p id="mensaje" class="notice" role="status"></p>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
document.getElementById("login").addEventListener("submit", async event => {
    event.preventDefault();
    const form = event.currentTarget;
    await App.submitJson(form, "/api/auth/login", "POST", "mensaje", () => {
        window.location.href = "/usuarios/perfil";
    });
});
</script>
</body>
</html>

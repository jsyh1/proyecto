<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mis notificaciones</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header><nav><a th:href="@{/}">Parqueadero</a><a th:href="@{/usuarios/perfil}">Mi perfil</a><a th:href="@{/sesiones/entrada}">Sesiones</a></nav></header>
<main>
    <h1>Notificaciones</h1>
    <p id="estado" class="notice" role="status">Cargando notificaciones…</p>
    <ul id="notificaciones" class="list"></ul>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
window.addEventListener("DOMContentLoaded", async () => {
    try {
        const response = await App.api("/api/usuarios/me/notificaciones");
        const data = await App.responseData(response);
        if (!response.ok) throw new Error("Inicia sesión para consultar tus notificaciones.");
        const list = document.getElementById("notificaciones");
        list.replaceChildren();
        for (const notification of data) {
            const item = document.createElement("li");
            item.textContent = `${notification.fechaCreacion} — ${notification.mensaje}`;
            list.append(item);
        }
        App.show("estado", data.length ? "" : "No tienes notificaciones todavía.");
    } catch (error) { App.show("estado", error.message, true); }
});
</script>
</body>
</html>

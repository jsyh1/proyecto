<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="30" th:if="${resumen.estado == 'ABIERTA'}">
    <title>Mi sesión de parqueadero</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; }
        main { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 8px; }
        dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
        dt { font-weight: bold; }
        dd { margin: 0; }
        .costo { font-size: 1.6em; font-weight: bold; margin: 16px 0 4px; }
        .nota { color: #555; font-size: 0.9em; }
    </style>
</head>
<body>
<main>
    <h1>Mi sesión de parqueadero</h1>
    <dl>
        <dt>Placa</dt><dd th:text="${resumen.placa}"></dd>
        <dt>Centro comercial</dt><dd th:text="${resumen.centro}"></dd>
        <dt>Hora de entrada</dt><dd th:text="${resumen.fechaEntrada}"></dd>
        <dt>Tiempo transcurrido</dt><dd th:text="${resumen.tiempoTranscurrido}"></dd>
        <dt>Valor por hora</dt>
        <dd>$ <span th:text="${#numbers.formatDecimal(resumen.valorHora, 1, 'POINT', 0, 'COMMA')}"></span></dd>
        <dt>Estado</dt><dd th:text="${resumen.estado}"></dd>
    </dl>
    <p class="costo">$ <span th:text="${#numbers.formatDecimal(resumen.costoActual, 1, 'POINT', 0, 'COMMA')}"></span></p>
    <p class="nota">Costo acumulado a la fecha. Se actualiza cada 30 segundos mientras la sesión esté abierta.</p>
    <p><a th:href="@{/sesiones/entrada}">Volver</a></p>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrar tarifas</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body>
<header><nav><a th:href="@{/}">Parqueadero</a><a th:href="@{/admin/beneficios}">Beneficios</a></nav></header>
<main>
    <h1>Tarifas por centro comercial</h1>
    <p>La vigencia no puede superponerse con otra tarifa activa del mismo centro.</p>
    <p id="estado" class="notice" role="status"></p>
    <form id="tarifa">
        <input name="id" type="hidden">
        <label>Centro comercial<select name="idCentro" id="centros" required></select></label>
        <label>Valor por hora<input name="valorHora" type="number" step="0.01" min="0.01" required></label>
        <label>Vigente desde<input name="fechaInicio" type="date" required></label>
        <label>Vigente hasta (opcional)<input name="fechaFin" type="date"></label>
        <label>Estado<select name="estado"><option>ACTIVA</option><option>INACTIVA</option></select></label>
        <button type="submit">Guardar tarifa</button>
        <button type="button" class="secondary" id="cancelar">Limpiar</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>Valor/hora</th><th>Vigencia</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="tarifas"></tbody></table></div>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
const tarifaForm = document.getElementById("tarifa");
const centrosSelect = document.getElementById("centros");
async function cargarCentros() {
    const response = await App.api("/api/centros");
    const centros = await App.responseData(response);
    if (!response.ok) throw new Error("No fue posible cargar los centros comerciales.");
    centrosSelect.replaceChildren();
    for (const centro of centros) {
        const option = document.createElement("option"); option.value = centro.id; option.textContent = centro.nombre;
        centrosSelect.append(option);
    }
}
async function cargarTarifas() {
    try {
        if (!centrosSelect.value) return;
        const response = await App.api(`/api/admin/tarifas?idCentro=${encodeURIComponent(centrosSelect.value)}`);
        const data = await App.responseData(response);
        if (!response.ok) throw new Error("Inicia sesión como administrador para gestionar tarifas.");
        const body = document.getElementById("tarifas"); body.replaceChildren();
        for (const tarifa of data) {
            const row = body.insertRow();
            row.insertCell().textContent = tarifa.valorHora;
            row.insertCell().textContent = `${tarifa.fechaInicio} — ${tarifa.fechaFin || "sin vencimiento"}`;
            row.insertCell().textContent = tarifa.estado;
            const button = document.createElement("button"); button.type = "button"; button.textContent = "Editar";
            button.addEventListener("click", () => {
                for (const [key, value] of Object.entries(tarifa)) {
                    if (tarifaForm.elements.namedItem(key)) tarifaForm.elements.namedItem(key).value = value ?? "";
                }
            });
            row.insertCell().append(button);
        }
        App.show("estado", "");
    } catch (error) { App.show("estado", error.message, true); }
}
centrosSelect.addEventListener("change", cargarTarifas);
tarifaForm.addEventListener("submit", async event => {
    event.preventDefault();
    const id = tarifaForm.elements.namedItem("id").value;
    const data = Object.fromEntries(["idCentro", "valorHora", "fechaInicio", "fechaFin", "estado"]
        .map(key => [key, tarifaForm.elements.namedItem(key).value || null]));
    data.idCentro = Number(data.idCentro); data.valorHora = Number(data.valorHora);
    const response = await App.api(id ? `/api/admin/tarifas/${id}` : "/api/admin/tarifas", {
        method: id ? "PUT" : "POST", body: JSON.stringify(data)
    });
    const result = await App.responseData(response);
    if (!response.ok) { App.show("estado", result.detail || "No fue posible guardar la tarifa.", true); return; }
    App.show("estado", "Tarifa guardada correctamente."); tarifaForm.reset(); await cargarTarifas();
});
document.getElementById("cancelar").addEventListener("click", () => tarifaForm.reset());
cargarCentros().then(cargarTarifas).catch(error => App.show("estado", error.message, true));
</script>
</body>
</html>
